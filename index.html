<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Track your bets, cash-outs and monthly limit. Your data stays on your own device.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}</style>
<title>Slipbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: a bettor's ledger. Season result on top, the slip and its log on the left, match data and the margin check on the right. */
:root{
  --bg:#E9ECF4;--surface:#F8F9FD;--ink:#1A2140;--muted:#5A6283;--line:#CBD1E2;
  --accent:#3346D3;--accent-ink:#FFFFFF;--accent-soft:#DFE3FA;
  --won:#0A7055;--won-soft:#D2EEE5;--lost:#B92A38;--lost-soft:#F9DEE1;--void:#5A6283;--void-soft:#E2E5EF;--warn:#8A5A00;--warn-soft:#F6E8C8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;--body:"Barlow","Helvetica Neue",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11152A;--surface:#1A2040;--ink:#E7EAF6;--muted:#A3ABCB;--line:#343C63;
  --accent:#93A1FF;--accent-ink:#11152A;--accent-soft:#2A3263;
  --won:#55D6AE;--won-soft:#163F3C;--lost:#FF8E99;--lost-soft:#4A2130;--void:#A3ABCB;--void-soft:#2B3254;--warn:#F0C069;--warn-soft:#453719;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11152A;--surface:#1A2040;--ink:#E7EAF6;--muted:#A3ABCB;--line:#343C63;
  --accent:#93A1FF;--accent-ink:#11152A;--accent-soft:#2A3263;
  --won:#55D6AE;--won-soft:#163F3C;--lost:#FF8E99;--lost-soft:#4A2130;--void:#A3ABCB;--void-soft:#2B3254;--warn:#F0C069;--warn-soft:#453719;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:400 15px/1.45 var(--body)}
.wrap{max-width:900px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;justify-content:space-between}
h1{font:600 32px/1 var(--display);letter-spacing:.01em;margin:0}
h2{font:600 22px/1.1 var(--display);letter-spacing:.015em;margin:0}
h3{font:600 13px/1.2 var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0}
.meta{color:var(--muted);font-size:13px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;min-width:0}
.notice{border-radius:6px;padding:10px 14px;background:var(--accent-soft);display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--won)}.neg{color:var(--lost)}

.result{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:20px}
.net{font:600 56px/1 var(--display);margin:4px 0 8px;font-variant-numeric:tabular-nums}
#chart{position:relative;min-height:200px;direction:ltr}
#chart svg{display:block;width:100%;touch-action:pan-y}
.tick{fill:var(--muted);font:400 12px var(--body);font-variant-numeric:tabular-nums}
.tip{position:absolute;top:8px;background:var(--ink);color:var(--bg);padding:6px 10px;border-radius:4px;font-size:13px;line-height:1.3;pointer-events:none;max-width:220px;z-index:2}
.tip b{font-weight:600}
.chart-empty{display:grid;place-items:center;height:200px;color:var(--muted);text-align:center;padding:16px}
.stats{display:grid;gap:12px;align-content:start}
.stat{border-top:1px solid var(--line);padding-top:10px}
.stat:first-child{border-top:0;padding-top:0}
.stat strong{display:block;font:600 28px/1.1 var(--display);margin-top:2px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:13px}

.columns{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:grid;gap:16px;min-width:0}

form{display:grid;gap:12px;margin-top:12px}
.fields{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.f{display:grid;gap:4px;min-width:0}
.f label{font-size:13px;color:var(--muted);font-weight:500}
.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c2{grid-column:span 2}
input,select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:8px 10px;width:100%;min-width:0}
input.num{font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.slip-foot{border-top:2px dashed var(--line);padding-top:12px;display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between}
.returns{display:flex;flex-wrap:wrap;gap:4px 20px}
.returns div span{display:block;font-size:13px;color:var(--muted)}
.returns div b{font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
button{font:500 14px var(--body);cursor:pointer;border-radius:4px;border:1px solid var(--line);background:transparent;color:var(--ink);padding:6px 10px}
button:hover{border-color:var(--accent)}
button:disabled{opacity:.5;cursor:default}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;padding:10px 18px}
.linkbtn{border:0;padding:0;color:var(--accent);text-decoration:underline;background:none}
.status-msg{font-size:13px;min-height:18px;color:var(--muted)}
.status-msg.err{color:var(--lost)}

.head-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button{padding:4px 10px;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.bets{list-style:none;margin:12px 0 0;padding:0}
.bet{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;padding:12px 0;border-top:1px solid var(--line)}
.bet:first-child{border-top:0}
.bet-title{font-weight:600;overflow-wrap:anywhere}
.bet-sub{color:var(--muted);font-size:13px;overflow-wrap:anywhere}
.bet-money{text-align:end;font-variant-numeric:tabular-nums}
.bet-money b{display:block;font:600 22px/1.1 var(--display)}
.pill{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.03em;padding:1px 7px;border-radius:3px;vertical-align:1px}
.pill.won{background:var(--won-soft);color:var(--won)}
.pill.lost{background:var(--lost-soft);color:var(--lost)}
.pill.void{background:var(--void-soft);color:var(--void)}
.pill.open,.pill.ex,.pill.cashout{background:var(--accent-soft);color:var(--ink)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.limit{display:grid;gap:8px}
.limit-top{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;justify-content:space-between}
.limit-amount{font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.track{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px}
.fill.warn{background:var(--warn)}
.fill.over{background:var(--lost)}
.legs-box{display:grid;gap:12px}
.leg-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.legs{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:4px}
.legs li{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center;font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.legs li.is-void>span:first-child{text-decoration:line-through}
.cash-input{width:110px}
.limit-msg{font-size:13px}
.limit-msg.warn{color:var(--warn)}
.limit-msg.over{color:var(--lost)}
.bet-actions{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.spacer{flex:1}
.empty{padding:20px 0 8px;color:var(--muted)}

.check{display:flex;gap:8px;align-items:center;font-size:14px}
.check input{width:auto}
.partial-line{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
.pill.free{background:var(--warn-soft);color:var(--warn)}
.insight-table{overflow-x:auto;margin-top:10px}
.columns,.stack{display:contents}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tabs button{border:0;border-radius:0;background:none;color:var(--muted);font:500 15px var(--body);padding:10px 14px}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{color:var(--accent);box-shadow:inset 0 -2px 0 var(--accent);font-weight:600}
@media (max-width:640px){
  .wrap{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-bottom:0;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:max(4px,env(safe-area-inset-left,0px));padding-right:max(4px,env(safe-area-inset-right,0px))}
  .tabs button{flex:1;min-width:0;padding:14px 2px;font-size:13px}
  .tabs button[aria-current="page"]{box-shadow:inset 0 2px 0 var(--accent)}
}
.head-end{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center}
.lang-pick{width:auto;padding:5px 8px;font-size:14px}
.chart-note{direction:ltr;display:grid;gap:4px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.note-row{display:flex;justify-content:space-between;gap:12px;font-size:15px}
.note-row b{font-weight:600;font-variant-numeric:tabular-nums}
.held{display:flex;flex-wrap:wrap;gap:2px 8px;align-items:center}
#chart rect[data-i],#hit{cursor:pointer}
#drill{margin-top:10px}
.drill-head{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between;margin-bottom:8px}
.drill-title{font:600 18px/1.2 var(--display);overflow-wrap:anywhere}
.drill-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:9px 0;border-top:1px solid var(--line)}
.drill-money{font-weight:600;font-variant-numeric:tabular-nums;text-align:end}
.limit-edit{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(76px,1fr));gap:8px;margin-top:12px}
.margin-out{margin-top:12px}
.margin-big{font:600 34px/1 var(--display);font-variant-numeric:tabular-nums}
.margin-table{overflow-x:auto;margin-top:10px}
table{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums}
th{font-weight:500;color:var(--muted);font-size:13px;text-align:end;padding:4px 0}
td{text-align:end;padding:5px 0;border-top:1px solid var(--line)}
th:first-child,td:first-child{text-align:start}

@media (max-width:820px){
  .result,.columns{grid-template-columns:minmax(0,1fr)}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .stat,.stat:first-child{border-top:1px solid var(--line);padding-top:10px}
  .net{font-size:48px}
}
@media (max-width:460px){.c2{grid-column:span 3}.c2.wide-sm,.c4{grid-column:span 6}}
@media (prefers-reduced-motion:no-preference){button{transition:border-color .12s}}
</style>

</head>
<body>
<div class="wrap">
  <header>
    <h1>Slipbook</h1>
    <div class="head-end"><span class="meta" data-i18n="Euros and decimal odds. Only you can see your bets.">Euros and decimal odds. Only you can see your bets.</span><select class="lang-pick" id="lang" aria-label="Language"></select></div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <button type="button" data-go="overview" data-i18n="Overview">Overview</button>
    <button type="button" data-go="new-bet" data-i18n="New bet">New bet</button>
    <button type="button" data-go="my-bets" data-i18n="My bets">My bets</button>
    <button type="button" data-go="insights" data-i18n="Insights">Insights</button>
    <button type="button" data-go="margin" data-i18n="Margin">Margin</button>
  </nav>

  <div id="pageNotice" class="notice" hidden></div>

  <section class="panel limit" data-view="overview" aria-label="Monthly limit" id="limit"></section>

  <section class="panel result" data-view="overview" aria-label="Overall result">
    <div style="min-width:0">
      <h3 data-i18n="Net profit or loss">Net profit or loss</h3>
      <div id="net" class="net">€0.00</div>
      <div class="seg" id="chartView" role="group" aria-label="Choose chart" style="margin-bottom:10px">
        <button type="button" data-c="run" aria-pressed="true" data-i18n="Running profit">Running profit</button>
        <button type="button" data-c="cash" aria-pressed="false" data-i18n="Cash-outs">Cash-outs</button>
        <button type="button" data-c="month" aria-pressed="false" data-i18n="Monthly profit">Monthly profit</button>
        <button type="button" data-c="sport" aria-pressed="false" data-i18n="By sport">By sport</button>
        <button type="button" data-c="type" aria-pressed="false" data-i18n="By bet type">By bet type</button>
      </div>
      <div id="chart"></div>
      <div id="drill"></div>
    </div>
    <div class="stats" id="stats"></div>
  </section>

  <div class="columns">
    <div class="stack">
      <section class="panel" data-view="new-bet" aria-labelledby="slipTitle">
        <div class="head-row">
          <h2 id="slipTitle">New bet</h2>
          <div class="seg" id="kind" role="group" aria-label="Bet type">
            <button type="button" data-k="single" aria-pressed="true" data-i18n="Single">Single</button>
            <button type="button" data-k="multi" aria-pressed="false" data-i18n="Multi">Multi</button>
          </div>
        </div>
        <form id="betForm" novalidate>
          <div class="fields">
            <div class="c6 legs-box" id="legsBox" hidden><div class="legs-box" id="legs"></div><div><button type="button" id="addLeg" data-i18n="Add leg">Add leg</button></div></div>
            <div class="f c6 single-only"><label for="event" data-i18n="Match">Match</label><input id="event" autocomplete="off" placeholder="Nice v Paris Saint-Germain" required></div>
            <div class="f c6 single-only"><label for="pick" data-i18n="Your selection">Your selection</label><input id="pick" autocomplete="off" placeholder="PSG to win" required></div>
            <div class="f c2 single-only"><label for="odds" data-i18n="Odds">Odds</label><input id="odds" class="num" type="number" inputmode="decimal" step="0.01" min="1.01" placeholder="1.50" required></div>
            <div class="f c2"><label for="stake"><span data-i18n="Stake">Stake</span> (€)</label><input id="stake" class="num" type="number" inputmode="decimal" step="0.01" min="0.01" placeholder="10" required></div>
            <div class="f c2 wide-sm"><label for="placed" data-i18n="Date">Date</label><input id="placed" class="num" type="date" required></div>
            <div class="f c3"><label for="book"><span data-i18n="Bookmaker">Bookmaker</span></label><input id="book" autocomplete="off"></div>
            <div class="f c3"><label for="sport" data-i18n="Sport">Sport</label><select id="sport"><option value="" data-i18n="Choose">Choose</option><option value="Football" data-i18n="Football">Football</option><option value="Basketball" data-i18n="Basketball">Basketball</option><option value="Tennis" data-i18n="Tennis">Tennis</option><option value="Other" data-i18n="Other">Other</option></select></div>
            <label class="check c6" for="free"><input type="checkbox" id="free"> <span data-i18n="This is a free bet">This is a free bet</span></label>
          </div>
          <div class="slip-foot">
            <div class="returns">
              <div id="prevOddsWrap" hidden><span data-i18n="Total odds">Total odds</span><b id="prevOdds">–</b></div>
              <div><span data-i18n="Implied probability">Implied probability</span><b id="prevProb">–</b></div>
              <div><span data-i18n="Returns if it wins">Returns if it wins</span><b id="prevRet">–</b></div>
            </div>
            <div class="seg"><button type="button" id="cancelEdit" hidden data-i18n="Cancel">Cancel</button><button class="primary" type="submit" id="saveBet">Save bet</button></div>
          </div>
          <div id="limitMsg" class="limit-msg" role="status" hidden></div>
          <div id="formMsg" class="status-msg" role="status"></div>
        </form>
      </section>

      <section class="panel" data-view="my-bets" aria-labelledby="logTitle">
        <div class="head-row">
          <h2 id="logTitle" data-i18n="Your bets">Your bets</h2>
          <div class="seg" id="betFilter" role="group" aria-label="Filter bets">
            <button type="button" data-f="all" aria-pressed="true" data-i18n="All">All</button>
            <button type="button" data-f="open" aria-pressed="false" data-i18n="Open">Open</button>
            <button type="button" data-f="settled" aria-pressed="false" data-i18n="Settled">Settled</button>
          </div>
        </div>
        <ul class="bets" id="bets"></ul>
        <div class="head-row" style="margin-top:12px"><button type="button" id="exportBtn" hidden data-i18n="Download spreadsheet">Download spreadsheet</button><span class="meta" id="exportMsg" role="status"></span></div>
      </section>
    </div>

    <div class="stack">
      <section class="panel" data-view="margin" aria-labelledby="marginTitle">
        <div class="head-row">
          <h2 id="marginTitle" data-i18n="Bookmaker margin">Bookmaker margin</h2>
          <div class="seg" id="way" role="group" aria-label="Number of outcomes">
            <button type="button" data-w="3" aria-pressed="true" data-i18n="Win / draw / win">Win / draw / win</button>
            <button type="button" data-w="2" aria-pressed="false" data-i18n="Two outcomes">Two outcomes</button>
          </div>
        </div>
        <div class="calc" id="calcInputs"></div>
        <div class="margin-out" id="marginOut" aria-live="polite"></div>
      </section>

      <section class="panel" data-view="insights" aria-labelledby="bdTitle">
        <div class="head-row">
          <h2 id="bdTitle" data-i18n="Where you win and lose">Where you win and lose</h2>
          <div class="seg" id="bdBy" role="group" aria-label="Group results by">
            <button type="button" data-b="sport" aria-pressed="true" data-i18n="Sport">Sport</button>
            <button type="button" data-b="type" aria-pressed="false" data-i18n="Bet type">Bet type</button>
            <button type="button" data-b="book" aria-pressed="false" data-i18n="Bookmaker">Bookmaker</button>
          </div>
        </div>
        <div class="insight-table" id="breakdown"></div>
      </section>

      <section class="panel" data-view="insights" aria-labelledby="monthsTitle">
        <h2 id="monthsTitle" data-i18n="Month by month">Month by month</h2>
        <div class="insight-table" id="months"></div>
      </section>
    </div>
  </div>
</div>

<script>
(function(){
  const $=id=>document.getElementById(id);
  const S={bets:[],filter:'all',uid:null,col:null,confirm:null,busy:new Set(),way:3,ready:false,kind:'single',legs:[],cashing:null,partial:null,editing:null,bd:'sport',dl:null,chart:'run',drill:null,drillF:'all'};

    const rest=b.status==='won'?r*(b.odds-1):b.status==='lost'?(free?0:-r):b.status==='cashout'?(free?got:got-r):0;
    return part+rest;
  }

  function summarize(bets){
    const decided=bets.filter(b=>b.status==='won'||b.status==='lost');
    const cashed=bets.filter(b=>b.status==='cashout');
    const settled=decided.concat(cashed);
    const open=bets.filter(b=>b.status==='open');
    const own=settled.filter(b=>!b.freeBet);
    const rated=decided.filter(b=>!b.freeBet);
    const staked=own.reduce((a,b)=>a+b.stake,0);
    const net=settled.reduce((a,b)=>a+profitOf(b),0);
    const wins=decided.filter(b=>b.status==='won').length;
    const ratedWins=rated.filter(b=>b.status==='won').length;
    return {count:settled.length,losses:decided.length-wins,cashed:cashed.length,staked,net,wins,
      roi:staked?net/staked:null,
      winRate:rated.length?ratedWins/rated.length:null,
      breakeven:rated.length?rated.reduce((a,b)=>a+1/b.odds,0)/rated.length:null,
      openCount:open.length,atRisk:open.filter(b=>!b.freeBet).reduce((a,b)=>a+remaining(b),0)};
  }

  function settledOrder(){
    return S.bets.filter(b=>b.status==='won'||b.status==='lost'||b.status==='cashout')
      .slice().sort((a,b)=>String(a.settledAt||a.placedAt).localeCompare(String(b.settledAt||b.placedAt))||(a.createdAt||0)-(b.createdAt||0));
  }

  function renderSummary(){

    net.className='net '+(s.net>0.004?'pos':s.net<-0.004?'neg':'');

  function niceStep(span,count){
    const raw=(span||1)/count,mag=Math.pow(10,Math.floor(Math.log10(raw))),n=raw/mag;
    return (n<=1?1:n<=2?2:n<=2.5?2.5:n<=5?5:10)*mag;
  }

  function lastMonths(n){
    const now=new Date(),out=[];
    for(let i=n-1;i>=0;i--){
      const d=new Date(now.getFullYear(),now.getMonth()-i,15);
      out.push({key:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0'),label:d.toLocaleDateString(loc(),{month:'short'}),long:d.toLocaleDateString(loc(),{month:'long',year:'numeric'})});
    }
    return out;
  }

  function cashStats(){
    const months={};let total=0,actual=0,held=0,unknown=0,known=0;
    S.bets.forEach(b=>{
      const p=partSum(b),partCount=Array.isArray(b.partials)?b.partials.length:0,full=b.status==='cashout';
      const count=partCount+(full?1:0);
      if(!count)return;
      const k=String(b.placedAt).slice(0,7);months[k]=(months[k]||0)+count;total+=count;
      if(b.status==='open')return;
      const result=full?b.ifHeld:b.status;
      if(!result){unknown++;return;}
      known++;
      const cashedStake=p.stake+(full?remaining(b):0),got=p.got+(full?(b.returned||0):0),free=!!b.freeBet;
      actual+=free?got:got-cashedStake;
      held+=result==='won'?cashedStake*(b.odds-1):result==='lost'?(free?0:-cashedStake):0;
    });
    return {months,total,actual,held,unknown,known};
  }
  function cashNoteHtml(c){
    const cls=v=>v>0.004?'pos':v<-0.004?'neg':'';
    const row=(k,v)=>'<div class="note-row"><span>'+esc(t(k))+'</span><b class="'+cls(v)+'">'+esc(c.known?signed(v):'–')+'</b></div>';
    return '<div class="chart-note">'+row('With cashing out',c.actual)+row('If you hadn’t cashed out',c.held)+(c.unknown?'<div class="meta">'+esc(t('Bets without a kept-it result are not counted:'))+' '+c.unknown+'</div>':'')+'</div>';
  }

  function renderBarChart(){
    const box=$('chart');
    let items=[],ref=null,empty='',note=null;
    if(S.chart==='cash'){
      const c=cashStats();
      items=lastMonths(6).map(m=>{const v=c.months[m.key]||0;return {key:m.key,name:m.long,label:m.label,value:v,color:'var(--accent)',text:String(v),tip:esc(m.long)+'<br>'+esc(t('Cash-outs'))+': '+v};});
      note=c;
      if(!c.total)empty=t('Cash-outs appear here once you cash out a bet.');
    }else if(S.chart==='month'){
      items=lastMonths(6).map(m=>{const v=S.bets.filter(b=>String(b.placedAt).startsWith(m.key)).reduce((a,b)=>a+profitOf(b),0);return {key:m.key,name:m.long,label:m.label,value:v,color:v<0?'var(--lost)':'var(--won)',text:signed(v),tip:esc(m.long)+'<br>'+esc(signed(v))};});
      if(!items.some(i=>Math.abs(i.value)>0.004))empty=t('Settle a bet to see this.');
    }else{
      const groups=groupResults(S.chart);
      items=[...groups.entries()].sort((a,b)=>b[1].net-a[1].net).map(([k,g])=>({key:k,name:k,label:k,value:g.net,color:g.net<0?'var(--lost)':'var(--won)',text:signed(g.net),tip:esc(k)+'<br>'+esc(signed(g.net))+'<br>'+esc(t('Bets'))+': '+g.n}));
      if(!items.length)empty=t('Settle a bet to see this.');
    }
    if(empty){box.innerHTML='<div class="chart-empty">'+esc(empty)+'</div>';return;}
    const W=Math.max(280,box.clientWidth||600),H=W>560?290:200,m={l:58,r:14,t:20,b:26};
    const vals=items.map(i=>i.value).concat(ref?[ref.value]:[]);
    const lo=Math.min(0,...vals),hi=Math.max(0,...vals);
    const step=S.chart==='cash'?Math.max(1,Math.ceil(niceStep(hi-lo,4))):niceStep(hi-lo,4),y0=Math.floor(lo/step)*step,y1=Math.ceil(hi/step)*step||step;
    const ticks=[];for(let v=y0;v<=y1+step/2;v+=step)ticks.push(Math.round(v*100)/100);
    const Y=v=>m.t+(H-m.t-m.b)*(1-(v-y0)/((y1-y0)||1));
    const band=(W-m.l-m.r)/items.length,bw=Math.min(56,band*0.6);
    const tickLabel=v=>S.chart==='cash'?String(v):(v<0?'−':'')+'€'+Math.abs(v).toLocaleString('en-GB',{maximumFractionDigits:step<1?2:0});
    const grid=ticks.map(v=>'<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"'+(v===0?'':' stroke-dasharray="2 4"')+'/><text class="tick" x="'+(m.l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+tickLabel(v)+'</text>').join('');
    const maxChars=Math.max(4,Math.floor(band/7));
    const shortLabel=t=>t.length>maxChars?t.slice(0,maxChars-1)+'…':t;
    const bars=items.map((it,i)=>{
      const cx=m.l+band*(i+0.5),x=cx-bw/2,base=Y(0),top=Y(it.value),h=Math.abs(top-base);
      let bar='';
      if(h>0.5){
        const r=Math.min(4,h,bw/2),up=it.value>0,dir=up?1:-1;
        bar='<path fill="'+it.color+'"'+(S.drill&&S.drill.key!==it.key?' fill-opacity="0.35"':'')+' d="M'+x+' '+base+'V'+(top+dir*r)+'Q'+x+' '+top+' '+(x+r)+' '+top+'H'+(x+bw-r)+'Q'+(x+bw)+' '+top+' '+(x+bw)+' '+(top+dir*r)+'V'+base+'Z"/>';
      }
      const valY=it.value<0?top+14:top-6;
      const val=band>=64&&Math.abs(it.value)>0.004?'<text class="tick" x="'+cx+'" y="'+valY+'" text-anchor="middle">'+esc(it.text)+'</text>':'';
      return bar+val+'<text class="tick" x="'+cx+'" y="'+(H-6)+'" text-anchor="middle">'+esc(shortLabel(it.label))+'</text><rect data-i="'+i+'" tabindex="0" role="button" aria-label="'+esc(it.name+' '+it.text)+'" x="'+(m.l+band*i)+'" y="0" width="'+band+'" height="'+H+'" fill="transparent"/>';
    }).join('');
    const refLine=ref?'<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(ref.value)+'" y2="'+Y(ref.value)+'" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="6 4"/><text class="tick" x="'+(W-m.r)+'" y="'+(Y(ref.value)-6)+'" text-anchor="end">'+esc(ref.label)+'</text>':'';
    const summary=items.map(i=>i.label+' '+i.text).join(', ');
    box.innerHTML='<svg height="'+H+'" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(summary)+'">'+grid+bars+refLine+'</svg><div class="tip" id="tip" hidden></div>'+(note?cashNoteHtml(note):'');
    const svg=box.querySelector('svg'),tip=$('tip');
    const show=e=>{
      const i=e.target.dataset.i;if(i==null){tip.hidden=true;return;}
      tip.innerHTML=items[+i].tip;tip.hidden=false;
      const r=svg.getBoundingClientRect(),sx=(m.l+band*(+i+0.5))*(r.width/W),tw=tip.offsetWidth;
      tip.style.left=Math.max(0,Math.min(r.width-tw,sx+12>r.width-tw?sx-tw-12:sx+12))+'px';
    };
    svg.addEventListener('pointermove',show);svg.addEventListener('pointerdown',show);svg.addEventListener('pointerleave',()=>{tip.hidden=true;});
    const pick=e=>{const i=e.target.dataset.i;if(i!=null)selectDrill(items[+i]);};
    svg.addEventListener('click',pick);
    svg.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e);}});
  }

  function renderRun(){

    const ticks=[];for(let v=y0;v<=y1+step/2;v+=step)ticks.push(Math.round(v*100)/100);

    const Y=v=>m.t+(H-m.t-m.b)*(1-(v-y0)/((y1-y0)||1));
    const tickLabel=v=>(v<0?'−':'')+'€'+Math.abs(v).toLocaleString('en-GB',{maximumFractionDigits:step<1?2:0});
    const grid=ticks.map(v=>'<line x1="'+m.l+'" x2="'+(W-m.r)+'" y1="'+Y(v)+'" y2="'+Y(v)+'" stroke="var(--line)" stroke-width="1"'+(v===0?'':' stroke-dasharray="2 4"')+'/><text class="tick" x="'+(m.l-8)+'" y="'+(Y(v)+4)+'" text-anchor="end">'+tickLabel(v)+'</text>').join('');
    const path=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.y).toFixed(1)).join(' ');

      '<circle id="endDot" cx="'+X(last)+'" cy="'+Y(pts[last].y)+'" r="5" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>'+

      let actions;
      if(S.confirm===b.id){
        actions='<span class="bet-sub">'+esc(t('Delete this bet?'))+'</span><button type="button" data-a="del" data-id="'+esc(b.id)+'"'+(busy?' disabled':'')+'>'+esc(t('Delete'))+'</button><button type="button" data-a="keep">'+esc(t('Keep'))+'</button>';
      }else if(S.partial===b.id){
        actions='<label class="bet-sub" for="partStake">'+esc(t('Stake'))+' (€)</label><input id="partStake" class="num cash-input" type="number" inputmode="decimal" step="0.01" min="0.01"><label class="bet-sub" for="partGot">'+esc(t('Received'))+' (€)</label><input id="partGot" class="num cash-input" type="number" inputmode="decimal" step="0.01" min="0"><button type="button" data-a="partsave" data-id="'+esc(b.id)+'"'+(busy?' disabled':'')+'>'+esc(t('Save'))+'</button><button type="button" data-a="partcancel">'+esc(t('Cancel'))+'</button>';
      }else if(S.cashing===b.id){
        actions='<label class="bet-sub" for="cashAmt">'+esc(t('Amount you got back'))+' (€)</label><input id="cashAmt" class="num cash-input" type="number" inputmode="decimal" step="0.01" min="0"><button type="button" data-a="cashsave" data-id="'+esc(b.id)+'"'+(busy?' disabled':'')+'>'+esc(t('Save'))+'</button><button type="button" data-a="cashcancel">'+esc(t('Cancel'))+'</button>';
      }else if(b.status==='open'){
        actions=['won','lost','void'].map(s=>'<button type="button" data-a="'+s+'" data-id="'+esc(b.id)+'"'+(busy?' disabled':'')+'>'+label[s]+'</button>').join('')+'<button type="button" data-a="cash" data-id="'+esc(b.id)+'"'+(busy?' disabled':'')+'>'+esc(t('Cash out'))+'</button><button type="button" data-a="partial" data-id="'+esc(b.id)+'"'+(busy?' disabled':'')+'>'+esc(t('Partial cash-out'))+'</button><span class="spacer"></span><button type="button" class="linkbtn" data-a="edit" data-id="'+esc(b.id)+'">'+esc(t('Edit'))+'</button><button type="button" class="linkbtn" data-a="ask" data-id="'+esc(b.id)+'">'+esc(t('Delete'))+'</button>';
      }else{
        actions='<button type="button" data-a="open" data-id="'+esc(b.id)+'"'+(busy?' disabled':'')+'>'+esc(t('Reopen'))+'</button><span class="spacer"></span><button type="button" class="linkbtn" data-a="edit" data-id="'+esc(b.id)+'">'+esc(t('Edit'))+'</button><button type="button" class="linkbtn" data-a="ask" data-id="'+esc(b.id)+'">'+esc(t('Delete'))+'</button>';
      }
      return '<li class="bet"><div style="min-width:0"><div class="bet-title">'+esc(b.event)+'</div><div class="bet-sub">'+sub+'</div>'+
        '<div class="bet-sub"><span class="pill '+esc(b.status)+'">'+label[b.status]+'</span>'+(b.example?' <span class="pill ex">'+esc(t('Example'))+'</span>':'')+(b.freeBet?' <span class="pill free">'+esc(t('Free bet'))+'</span>':'')+(b.sport?' <span class="bet-sub">'+esc(t(b.sport))+'</span>':'')+' '+esc(b.placedAt)+'</div>'+partialHtml(b,busy)+heldHtml(b,busy)+legsHtml(b,busy)+'</div>'+
        '<div class="bet-money">'+moneyCell+'</div><div class="bet-actions">'+actions+'</div></li>';
    }).join('');
  }

  function heldHtml(b,busy){
    if(b.status!=='cashout')return '';
    const dis=busy?' disabled':'';
    if(b.ifHeld)return '<div class="bet-sub held"><span>'+esc(t('If you had kept it'))+': '+esc(t({won:'Won',lost:'Lost',void:'Void'}[b.ifHeld]))+'</span><button type="button" class="linkbtn" data-a="heldclear" data-id="'+esc(b.id)+'"'+dis+'>'+esc(t('Change'))+'</button></div>';
    return '<div class="bet-sub held"><span>'+esc(t('If you had kept it'))+':</span>'+[['won','Won'],['lost','Lost'],['void','Void']].map(x=>'<button type="button" data-a="held" data-r="'+x[0]+'" data-id="'+esc(b.id)+'"'+dis+'>'+esc(t(x[1]))+'</button>').join('')+'</div>';
  }

  function partialHtml(b,busy){
    const p=partSum(b);
    if(!p.stake)return '';
    return '<div class="bet-sub partial-line"><span>'+esc(t('Partial cash-out'))+': \u200e'+esc(money(p.stake))+' → '+esc(money(p.got))+'</span>'+(b.status==='open'?'<button type="button" class="linkbtn" data-a="partundo" data-id="'+esc(b.id)+'"'+(busy?' disabled':'')+'>'+esc(t('Undo last'))+'</button>':'')+'</div>';
  }

  function statTable(heads,rows){
    return '<table><thead><tr>'+heads.map(h=>'<th>'+h+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map((c,i)=>'<td'+(i===r.length-2?' class="'+(c.v>0.004?'pos':c.v<-0.004?'neg':'')+'"':'')+'>'+esc(c.t)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';
  }
  const cell=(t,v)=>({t,v});
  function roiText(net,staked){return staked?'\u200e'+(net>0?'+':'')+pct(net/staked):'–';}

  function groupKey(b,by){return by==='sport'?(b.sport?t(b.sport):t('Not set')):by==='book'?(b.book||t('Not set')):t(b.type==='multi'?'Multi':'Single')+(b.freeBet?' ('+t('Free bet')+')':'');}
  function groupResults(by){
    const keyOf=b=>groupKey(b,by);
    const groups=new Map();
    S.bets.filter(b=>['won','lost','cashout'].includes(b.status)).forEach(b=>{
      const k=keyOf(b),g=groups.get(k)||{n:0,staked:0,net:0};
      g.n++;g.staked+=b.freeBet?0:b.stake;g.net+=profitOf(b);groups.set(k,g);
    });
    return groups;
  }

  function renderBreakdown(){
    [...$('bdBy').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.b===S.bd));
    const groups=groupResults(S.bd);
    if(!groups.size){$('breakdown').innerHTML='<div class="empty">'+esc(t('Settle a bet to see this.'))+'</div>';return;}
    const rows=[...groups.entries()].sort((a,b)=>b[1].net-a[1].net).map(([k,g])=>[cell(k),cell(String(g.n)),cell(money(g.staked)),cell(signed(g.net),g.net),cell(roiText(g.net,g.staked))]);
    $('breakdown').innerHTML=statTable([t(S.bd==='sport'?'Sport':S.bd==='book'?'Bookmaker':'Bet type'),t('Bets'),t('Staked'),t('Profit'),t('Return')],rows);
  }

  function renderMonths(){
    const groups=new Map();
    S.bets.forEach(b=>{
      const k=String(b.placedAt).slice(0,7);
      const g=groups.get(k)||{n:0,staked:0,net:0};
      g.n++;
      if(!b.freeBet&&b.status!=='void')g.staked+=b.stake;
      g.net+=profitOf(b);groups.set(k,g);
    });
    if(!groups.size){$('months').innerHTML='<div class="empty">'+esc(t('No bets yet. Add one under New bet.'))+'</div>';return;}
    const label=k=>new Date(k+'-15T12:00:00').toLocaleDateString(loc(),{month:'short',year:'numeric'});
    const rows=[...groups.entries()].sort((a,b)=>b[0].localeCompare(a[0])).slice(0,24).map(([k,g])=>[cell(label(k)),cell(String(g.n)),cell(money(g.staked)),cell(signed(g.net),g.net),cell(roiText(g.net,g.staked))]);
    $('months').innerHTML=statTable([t('Month'),t('Bets'),t('Staked'),t('Profit'),t('Return')],rows)+'<p class="meta" style="margin:8px 0 0">'+esc(t('Bets are counted in the month you placed them. Open bets count once they settle.'))+'</p>';
  }

  function csvCell(v){
    let t=v==null?'':String(v);
    if(typeof v==='string'&&/^[=+\-@\t\r]/.test(t))t="'"+t;
    return /[",\n\r;]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t;
  }
  function buildCsv(bets){
    const head=['Date','Sport','Match','Selection','Type','Odds','Stake','Free bet','Bookmaker','Status','Cash-out received','Partial stake cashed','Partial received','Profit','Settled at','Legs','If kept'];
    const rows=bets.slice().sort((a,b)=>String(a.placedAt).localeCompare(String(b.placedAt))).map(b=>{
      const p=partSum(b);
      const legs=Array.isArray(b.legs)?b.legs.map(l=>l.event+' / '+l.pick+' @ '+l.odds+(l.void?' (void)':'')).join(' | '):'';
      return [b.placedAt,b.sport||'',b.event,b.pick,b.type==='multi'?'Multi':'Single',b.odds,b.stake,b.freeBet?'Yes':'No',b.book||'',STATUS[b.status],b.status==='cashout'?(b.returned||0):'',p.stake||'',p.got||'',b.status==='open'?'':Math.round(profitOf(b)*100)/100,b.settledAt||'',legs,b.ifHeld?STATUS[b.ifHeld]:''];
    });
    return '﻿'+[head].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n')+'\r\n';
  }

  const VIEWS=['overview','new-bet','my-bets','insights','margin'];
  function setView(v,skipHash){
    if(!VIEWS.includes(v))v='overview';
    document.querySelectorAll('[data-view]').forEach(n=>{n.hidden=n.dataset.view!==v;});
    [...$('tabs').children].forEach(b=>{if(b.dataset.go===v)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');});
    if(!skipHash){try{if(location.hash.slice(1)!==v)location.hash=v;}catch(e){}}
    window.scrollTo(0,0);
    if(v==='overview')renderChart();
  }

  function applySlipText(){
    $('slipTitle').textContent=t(S.editing?'Edit bet':'New bet');
    $('saveBet').textContent=t(S.editing?'Save changes':'Save bet');
  }
  function applyLanguage(){
    const rtl=S.lang==='ar'||S.lang==='ur';
    document.documentElement.lang=S.lang;document.documentElement.dir=rtl?'rtl':'ltr';
    document.querySelectorAll('[data-i18n]').forEach(n=>{n.textContent=t(n.dataset.i18n);});
    applySlipText();
  }
  function changeLanguage(l){
    S.lang=l;try{localStorage.setItem('slipbook-lang',l);}catch(e){}
    const vals=[...$('calcInputs').querySelectorAll('input')].map(i=>i.value);
    applyLanguage();renderLegs();renderMargin();
    [...$('calcInputs').querySelectorAll('input')].forEach((i,n)=>{if(vals[n]!=null)i.value=vals[n];});
    computeMargin();renderAll();$('exportMsg').textContent='';say('');
  }

  function setKind(k){
    S.kind=k;[...$('kind').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===k));
    document.querySelectorAll('.single-only').forEach(n=>{n.hidden=k==='multi';});
    $('legsBox').hidden=k!=='multi';preview();
  }
  function resetSlip(){
    S.editing=null;
    ['event','pick','odds','stake','book'].forEach(i=>$(i).value='');
    $('sport').value='';$('free').checked=false;$('placed').value=today();
    S.legs=blankLegs();renderLegs();setKind('single');
    applySlipText();$('cancelEdit').hidden=true;
    preview();
  }
  function startEdit(id){
    const b=S.bets.find(x=>x.id===id);if(!b)return;
    S.editing=id;
    if(b.type==='multi'&&Array.isArray(b.legs)){
      S.legs=b.legs.map(l=>({event:l.event,pick:l.pick,odds:String(l.odds),void:!!l.void}));
      ['event','pick','odds'].forEach(i=>$(i).value='');
      renderLegs();setKind('multi');
    }else{
      $('event').value=b.event;$('pick').value=b.pick;$('odds').value=b.odds;
      S.legs=blankLegs();renderLegs();setKind('single');
    }
    $('stake').value=b.stake;$('placed').value=b.placedAt;$('book').value=b.book||'';
    $('sport').value=b.sport||'';$('free').checked=!!b.freeBet;
    applySlipText();$('cancelEdit').hidden=false;
    preview();say(t('Change the details, then press Save changes.'));
    setView('new-bet');
  }

  function legsHtml(b,busy){
    if(!Array.isArray(b.legs))return '';
    return '<ul class="legs">'+b.legs.map((l,i)=>'<li'+(l.void?' class="is-void"':'')+'><span>'+esc(l.event)+' · '+esc(l.pick)+' @ '+Number(l.odds).toFixed(2)+'</span>'+(l.void?'<span class="pill void">'+esc(t('Void leg'))+'</span>':'')+(b.status==='open'?'<button type="button" class="linkbtn" data-a="legvoid" data-id="'+esc(b.id)+'" data-leg="'+i+'"'+(busy?' disabled':'')+'>'+esc(t(l.void?'Undo void':'Void leg'))+'</button>':'')+'</li>').join('')+'</ul>';
  }

  function monthStaked(month){
    return S.bets.filter(b=>!b.freeBet&&b.status!=='void'&&String(b.placedAt).startsWith(month)).reduce((a,b)=>a+b.stake,0);
  }

  function renderLimit(){
    const spent=monthStaked(today().slice(0,7));
    const name=new Date().toLocaleString(loc(),{month:'long'});
    const over=spent>S.limit+0.004,near=!over&&spent>=S.limit*0.8;
    const left=over?t('Over limit')+': '+money(spent-S.limit):t('Left')+': '+money(S.limit-spent);
    const pill=over?'<span class="pill lost">'+esc(t('Over limit'))+'</span>':near?'<span class="pill warn">'+esc(t('Nearly at limit'))+'</span>':'<span class="pill won">'+esc(t('Within limit'))+'</span>';
    $('limit').innerHTML='<div class="limit-top"><h3>'+esc(name)+' · '+esc(t('Limit'))+'</h3><span class="meta">'+pill+'</span></div>'+
      '<div class="limit-top"><span class="limit-amount">'+esc(t('Staked'))+': \u200e'+esc(money(spent))+' / '+esc(money(S.limit))+'</span><span class="meta num">'+esc(left)+'</span></div>'+
      '<div class="track"><div class="fill'+(over?' over':near?' warn':'')+'" style="width:'+Math.min(100,spent/S.limit*100)+'%"></div></div>'+
      (S.limEdit?'<div class="limit-edit"><label class="bet-sub" for="limitInput">'+esc(t('Monthly limit'))+' (€)</label><input id="limitInput" class="num cash-input" type="number" inputmode="decimal" step="1" min="1" value="'+esc(S.limit)+'"><button type="button" data-lim="save">'+esc(t('Save'))+'</button><button type="button" data-lim="cancel">'+esc(t('Cancel'))+'</button></div>':'<div><button type="button" class="linkbtn" data-lim="edit">'+esc(t('Change limit'))+'</button></div>');
  }

  function renderLegs(){
    $('legs').innerHTML=S.legs.map((l,i)=>'<div><div class="leg-head"><h3>'+esc(t('Leg'))+' '+(i+1)+'</h3>'+(S.legs.length>2?'<button type="button" class="linkbtn" data-rm="'+i+'">'+esc(t('Remove'))+'</button>':'')+'</div><div class="fields">'+
      '<div class="f c6"><label for="legEvent'+i+'">'+esc(t('Match'))+'</label><input id="legEvent'+i+'" autocomplete="off" data-i="'+i+'" data-k="event" value="'+esc(l.event)+'"></div>'+
      '<div class="f c4"><label for="legPick'+i+'">'+esc(t('Your selection'))+'</label><input id="legPick'+i+'" autocomplete="off" data-i="'+i+'" data-k="pick" value="'+esc(l.pick)+'"></div>'+
      '<div class="f c2 wide-sm"><label for="legOdds'+i+'">'+esc(t('Odds'))+'</label><input id="legOdds'+i+'" class="num" type="number" inputmode="decimal" step="0.01" min="1.01" data-i="'+i+'" data-k="odds" value="'+esc(l.odds)+'"></div></div></div>').join('');
  }

  function slipOdds(){
    if(S.kind==='single')return parseFloat($('odds').value);
    const o=S.legs.filter(l=>!l.void).map(l=>parseFloat(l.odds));
    return o.every(x=>x>1)?o.reduce((a,b)=>a*b,1):NaN;
  }

  function renderMargin(){
    const names=(S.way===3?['Home','Draw','Away']:['Side A','Side B']).map(t);
    const box=$('calcInputs');
    const defaults=S.way===3?['2.10','3.40','3.60']:['1.91','1.91'];
    box.innerHTML=names.map((n,i)=>'<div class="f"><label for="m'+i+'">'+n+'</label><input id="m'+i+'" class="num" type="number" inputmode="decimal" step="0.01" min="1.01" value="'+defaults[i]+'"></div>').join('');
    computeMargin();
  }
  function computeMargin(){
    const names=(S.way===3?['Home','Draw','Away']:['Side A','Side B']).map(t);
    const odds=names.map((_,i)=>parseFloat($('m'+i).value));
    if(odds.some(o=>!(o>1))){$('marginOut').innerHTML='<span class="meta">'+esc(t('Enter decimal odds above 1 for every outcome.'))+'</span>';return;}
    const imp=odds.map(o=>1/o),sum=imp.reduce((a,b)=>a+b,0);
    $('marginOut').innerHTML='<div class="margin-big">'+pct(sum-1)+'</div><div class="meta">'+esc(t('Total'))+': '+pct(sum)+'. '+esc(t('Anything over 100% is the bookmaker’s built-in edge.'))+'</div>'+
      '<div class="margin-table"><table><thead><tr><th>'+esc(t('Outcome'))+'</th><th>'+esc(t('Implied'))+'</th><th>'+esc(t('Without margin'))+'</th><th>'+esc(t('Fair odds'))+'</th></tr></thead><tbody>'+
      names.map((n,i)=>'<tr><td>'+n+'</td><td>'+pct(imp[i])+'</td><td>'+pct(imp[i]/sum)+'</td><td>'+(sum/imp[i]).toFixed(2)+'</td></tr>').join('')+'</tbody></table></div>';
  }

  function preview(){
    const o=slipOdds(),s=parseFloat($('stake').value);
    $('prevOddsWrap').hidden=S.kind!=='multi';
    $('prevOdds').textContent=o>1?o.toFixed(2):'–';
    const lm=$('limitMsg'),month=($('placed').value||'').slice(0,7),isNow=month===today().slice(0,7);
    const was=S.editing?S.bets.find(x=>x.id===S.editing):null;
    const counted=was&&!was.freeBet&&was.status!=='void'&&String(was.placedAt).startsWith(month)?was.stake:0;
    const after=s>0&&isNow&&!$('free').checked?monthStaked(month)-counted+s:0;
    if(after>S.limit+0.004){lm.hidden=false;lm.className='limit-msg over';lm.textContent=t('This bet would put you over your limit by')+' '+money(after-S.limit);}
    else if(after>=S.limit*0.8){lm.hidden=false;lm.className='limit-msg warn';lm.textContent=t('Left of your limit after this bet')+': '+money(S.limit-after);}
    else{lm.hidden=true;lm.textContent='';}
    $('prevProb').textContent=o>1?pct(1/o):'–';
    $('prevRet').textContent=o>1&&s>0?money($('free').checked?(o-1)*s:o*s):'–';
  }
  function say(t,err){const m=$('formMsg');m.textContent=t;m.className='status-msg'+(err?' err':'');}
  function writeError(e){
    if(e&&e.code==='quota_exceeded')return 'Storage is full. Delete some old bets, then try again.';
    if(e&&e.code==='invalid_argument')return 'This account can only view the page, so the bet was not saved.';
    return 'The change did not save. Check your connection and try again.';
  }

  $('betForm').addEventListener('submit',async e=>{
    e.preventDefault();
    if(!S.col){say('Still loading. Try again in a moment.',true);return;}
    const stake=parseFloat($('stake').value),placedAt=$('placed').value;
    let event,pick,odds,extra={};
    if(S.kind==='multi'){
      const legs=S.legs.map(l=>({event:l.event.trim(),pick:l.pick.trim(),odds:parseFloat(l.odds),void:!!l.void}));
      if(legs.some(l=>!l.event||!l.pick)){say(t('Fill in the match and selection.'),true);return;}
      if(legs.some(l=>!(l.odds>1))){say(t('Odds must be above 1, for example 1.85.'),true);return;}
      odds=multiOdds(legs);event='Multi: '+legs.length+' legs';pick=legs.map(l=>l.pick).join(', ');extra={type:'multi',legs};
    }else{
      event=$('event').value.trim();pick=$('pick').value.trim();odds=parseFloat($('odds').value);
      if(!event||!pick){say(t('Fill in the match and selection.'),true);return;}
      if(!(odds>1)){say(t('Odds must be above 1, for example 1.85.'),true);return;}
    }
    if(!(stake>0)){say(t('Stake must be more than zero.'),true);return;}
    if(!placedAt){say(t('Choose a date.'),true);return;}
    const editing=S.editing?S.bets.find(x=>x.id===S.editing):null;
    if(editing&&partSum(editing).stake>=stake){say(t('Stake must be more than the part already cashed out.'),true);return;}
    const fields=Object.assign({event,pick,odds,stake,placedAt,sport:$('sport').value||null,freeBet:$('free').checked,book:$('book').value.trim()||null,type:null,legs:null},extra);
    const btn=$('saveBet');btn.disabled=true;
    try{
      if(editing){await S.col.doc(editing.id).update(fields);resetSlip();say('');setView('my-bets');}
      else{await S.col.doc().set(Object.assign(fields,{status:'open',createdAt:Date.now()}));resetSlip();say(t('Bet saved.'));}
    }catch(err){say(writeError(err),true);}
    btn.disabled=false;
  });
  ['odds','stake','placed'].forEach(i=>$(i).addEventListener('input',preview));
  $('free').addEventListener('change',preview);
  $('limit').addEventListener('click',async e=>{
    const a=e.target.dataset.lim;if(!a)return;
    if(a==='edit'){S.limEdit=true;renderLimit();const i=$('limitInput');if(i)i.focus();return;}
    if(a==='cancel'){S.limEdit=false;renderLimit();return;}
    const v=parseFloat($('limitInput').value);
    if(!(v>0)){S.pageMsg=t('Enter valid amounts.');renderNotice();return;}
    try{
      if(!S.col)throw new Error('not ready');
      await S.col.doc('_settings').set({monthlyLimit:v});
      S.limit=v;S.limEdit=false;S.pageMsg=null;renderAll();
    }catch(err){S.pageMsg=writeError(err);renderNotice();}
  });
  $('drill').addEventListener('click',e=>{
    const f=e.target.dataset.df;
    if(f){S.drillF=f;renderDrill();return;}
    if(e.target.dataset.dclose){S.drill=null;renderChart();}
  });
  $('lang').addEventListener('change',e=>changeLanguage(e.target.value));
  $('chartView').addEventListener('click',e=>{
    const c=e.target.dataset.c;if(!c)return;
    S.chart=c;try{localStorage.setItem('slipbook-chart',c);}catch(err){}
    renderChart();
  });
  $('cancelEdit').addEventListener('click',()=>{resetSlip();say('');setView('my-bets');});
  $('tabs').addEventListener('click',e=>{const v=e.target.dataset.go;if(v)setView(v);});
  window.addEventListener('hashchange',()=>setView(location.hash.slice(1),true));
  $('bdBy').addEventListener('click',e=>{const b=e.target.dataset.b;if(b){S.bd=b;renderBreakdown();}});
  $('exportBtn').addEventListener('click',async()=>{
    const m=$('exportMsg'),real=S.bets.filter(b=>!b.example);
    if(!real.length){m.textContent=t('No bets of your own to save yet.');return;}
    try{await S.dl.save({filename:'slipbook-bets-'+today()+'.csv',data:buildCsv(real)});m.textContent=t('Spreadsheet saved.');}
    catch(e){m.textContent=e&&e.code==='declined'?t('Download cancelled.'):e&&e.code==='rate_limited'?'A download is already waiting for your answer.':'The spreadsheet could not be saved here.';}
  });

  $('betFilter').addEventListener('click',e=>{
    const f=e.target.dataset.f;if(!f)return;
    S.filter=f;[...$('betFilter').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.f===f));renderBets();
  });
  $('kind').addEventListener('click',e=>{const k=e.target.dataset.k;if(k)setKind(k);});
  $('legs').addEventListener('input',e=>{
    const d=e.target.dataset;if(d.k==null)return;
    S.legs[+d.i][d.k]=e.target.value;preview();
  });
  $('legs').addEventListener('click',e=>{
    const r=e.target.dataset.rm;if(r==null)return;
    S.legs.splice(+r,1);renderLegs();preview();
  });
  $('addLeg').addEventListener('click',()=>{S.legs.push({event:'',pick:'',odds:''});renderLegs();preview();});
  $('way').addEventListener('click',e=>{
    const w=+e.target.dataset.w;if(!w)return;
    S.way=w;[...$('way').children].forEach(b=>b.setAttribute('aria-pressed',+b.dataset.w===w));renderMargin();
  });
  $('calcInputs').addEventListener('input',computeMargin);

  $('pageNotice').addEventListener('click',async e=>{
    if(e.target.id!=='clearEx'||!S.col)return;
    e.target.disabled=true;
    try{for(const b of S.bets.filter(x=>x.example))await S.col.doc(b.id).delete();}
    catch(err){S.pageMsg=writeError(err);renderNotice();}
  });

  $('bets').addEventListener('click',async e=>{
    const a=e.target.dataset.a,id=e.target.dataset.id;if(!a)return;
    if(a==='ask'){S.confirm=id;renderBets();return;}
    if(a==='keep'){S.confirm=null;renderBets();return;}
    if(a==='cash'){S.cashing=id;S.confirm=null;renderBets();const i=$('cashAmt');if(i)i.focus();return;}
    if(a==='cashcancel'){S.cashing=null;renderBets();return;}
    if(a==='edit'){startEdit(id);return;}
    if(a==='partial'){S.partial=id;S.cashing=null;S.confirm=null;renderBets();const i=$('partStake');if(i)i.focus();return;}
    if(a==='partcancel'){S.partial=null;renderBets();return;}
    let part=null;
    if(a==='partsave'){
      const b=S.bets.find(x=>x.id===id),ps=parseFloat($('partStake').value),pg=parseFloat($('partGot').value);
      if(!(ps>0)||!(ps<remaining(b))||!(pg>=0)){S.pageMsg=t('Enter valid amounts.');renderNotice();return;}
      part=(Array.isArray(b.partials)?b.partials:[]).concat([{stake:ps,got:pg}]);
    }
    let amt=null;
    if(a==='cashsave'){
      amt=parseFloat($('cashAmt').value);
      if(!(amt>=0)){S.pageMsg=t('Enter valid amounts.');renderNotice();return;}
    }
    if(!S.col||S.busy.has(id))return;
    S.busy.add(id);renderBets();
    try{
      const ref=S.col.doc(id);
      if(a==='del'){await ref.delete();S.confirm=null;}
      else if(a==='open')await ref.update({status:'open',settledAt:null,returned:null,ifHeld:null});
      else if(a==='held')await ref.update({ifHeld:e.target.dataset.r});
      else if(a==='heldclear')await ref.update({ifHeld:null});
      else if(a==='partsave'){await ref.update({partials:part});S.partial=null;}
      else if(a==='partundo'){const b=S.bets.find(x=>x.id===id);await ref.update({partials:b.partials.slice(0,-1)});}
      else if(a==='cashsave'){await ref.update({status:'cashout',returned:amt,settledAt:new Date().toISOString()});S.cashing=null;}
      else if(a==='legvoid'){
        const b=S.bets.find(x=>x.id===id),n=+e.target.dataset.leg;
        const legs=b.legs.map((l,i)=>Object.assign({},l,i===n?{void:!l.void}:{}));
        await ref.update({legs,odds:multiOdds(legs)});
      }
      else await ref.update({status:a,settledAt:new Date().toISOString()});
      S.pageMsg=null;
    }catch(err){S.pageMsg=writeError(err);}
    S.busy.delete(id);renderNotice();renderBets();
  });

  function renderAll(){renderNotice();renderLimit();renderSummary();renderBets();renderBreakdown();renderMonths();preview();}

  function localCollection(){
    const KEY='slipbook-data-v1';
    const read=()=>{try{return JSON.parse(localStorage.getItem(KEY)||'{}')||{};}catch(e){return {};}};
    const write=o=>{try{localStorage.setItem(KEY,JSON.stringify(o));}catch(e){const err=new Error('Could not save');err.code='quota_exceeded';throw err;}};
    let listener=null;
    const emit=()=>{if(!listener)return;const o=read();listener({docs:Object.keys(o).map(id=>({id,exists:true,data:()=>o[id]})),metadata:{fromCache:false,hasPendingWrites:false}});};
    window.addEventListener('storage',e=>{if(e.key===KEY)emit();});
    return {
      doc(id){
        const docId=id||('b'+Date.now().toString(36)+Math.random().toString(36).slice(2,8));
        return {id:docId,
          async set(d){const o=read();o[docId]=d;write(o);emit();},
          async update(d){const o=read();o[docId]=Object.assign(o[docId]||{},d);write(o);emit();},
          async delete(){const o=read();delete o[docId];write(o);emit();}};
      },
      onSnapshot(next){listener=next;setTimeout(emit,0);return ()=>{listener=null;};}
    };
  }
  const browserDownloads={save:async({filename,data})=>{
    const url=URL.createObjectURL(new Blob([data],{type:'text/csv;charset=utf-8'}));
    const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);
    return {status:'saved'};
  }};

  async function boot(){
    $('placed').value=today();
    $('lang').innerHTML=I18N.langs.map(x=>'<option value="'+x[0]+'">'+esc(x[1])+'</option>').join('');$('lang').value=S.lang;applyLanguage();
    setView(location.hash.slice(1),true);renderLegs();renderMargin();renderAll();
    if(window.ResizeObserver){let w=0;new ResizeObserver(en=>{const n=Math.round(en[0].contentRect.width);if(n!==w){w=n;renderChart();}}).observe($('chart'));}
    try{S.dl=window.claude?await window.claude.use('downloads'):browserDownloads;}catch(e){S.dl=null;}
    $('exportBtn').hidden=!S.dl;
    let db=null,user=null;
    try{[db,user]=await Promise.all([window.claude?window.claude.use('db'):null,window.claude?window.claude.use('user'):null]);}catch(e){}
    let uid=null;
    try{uid=user?await user.id():null;}catch(e){}
    const local=!db||!uid;
    S.col=local?localCollection():db.collection('data/users/'+uid);
    if(local){const tag=document.querySelector('.head-end [data-i18n]');tag.dataset.i18n='Euros and decimal odds. Your bets are saved on this device only.';applyLanguage();}
    const timer=setTimeout(()=>{if(!S.ready){S.pageMsg='Your bets can’t be reached yet. Check your connection.';S.ready=true;renderAll();}},10000);
    S.col.onSnapshot(snap=>{
      S.bets=snap.docs.map(d=>Object.assign({id:d.id},d.data())).filter(b=>typeof b.odds==='number'&&typeof b.stake==='number');
      const st=snap.docs.find(d=>d.id==='_settings');
      if(st&&st.data().monthlyLimit>0)S.limit=st.data().monthlyLimit;
      if(!snap.metadata.fromCache){clearTimeout(timer);if(S.ready&&S.pageMsg&&/can’t be reached/.test(S.pageMsg))S.pageMsg=null;}
      S.ready=true;renderAll();
    },()=>{clearTimeout(timer);S.ready=true;S.pageMsg='Your bets could not be loaded. Reload the page to try again.';renderAll();});
  }
  boot();
})();
</script>
</body>
